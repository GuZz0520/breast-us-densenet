project_name: "breast_us_densenet"
seed: 2025
device: "cuda"    # 没GPU就改 "cpu"

data:
  train_csv: "data/train.csv"
  val_csv:   "data/val.csv"
  test_csv:  "data/test.csv"
  num_classes: 3
  img_size: 224
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  aug:
    flip: true
    rotate_limit: 15
    brightness_contrast: 0.2

model:
  backbone: "densenet121"
  pretrained: true
  head_dropout: 0.2
  attention: "se"          # none | se
  freeze_schedule: ["head", "block4", "full"]

train:
  epochs: 80
  batch_size: 32
  num_workers: 4
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine"
  early_stopping: 10
  label_smoothing: 0.05
  loss: "focal"            # ce | focal | cbce
  focal_gamma: 2.0
  mixup_alpha: 0.2

save:
  out_dir: "outputs"
  best_metric: "macro_f1"
